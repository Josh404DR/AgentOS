name: CI Security

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  repository-boundary:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
      - name: Reject generated artifacts, oversized files, and literal secrets
        shell: pwsh
        run: ./scripts/repository_hygiene_check.ps1 -AgentOSRoot $PWD
      - name: Reject tracked local environment files
        shell: pwsh
        run: |
          $bad = @(git ls-files | Where-Object { $_ -match '(^|/)(\.env|credentials|secrets)(\.|/|$)' -and $_ -notmatch '\.example$' })
          if ($bad.Count) { $bad | ForEach-Object { Write-Error "forbidden tracked path: $_" }; exit 1 }
          Write-Output "tracked_secret_path_check=PASS"
